  <script id="digest-data" type="application/json">"# AI Builders Digest — 2026年11月26日星期四\n\n追踪全球顶尖 AI Builder、研究员与创始人的一手动态与思考。\n\n---\n\n## 🐦 X / Twitter 动态\n\n### Anthropic Claude 团队的 Boris Cherny (bcherny on X)\n**一句话：MCP server 现在可以自带 skills 一起发布，Claude Code 装上一个 MCP 就知道该怎么用它，开箱即用**\n\n- 这是把「接工具」和「教用法」合并成一个分发单元：过去接了 MCP 还得自己写 prompt 或 skill 告诉模型怎么调，现在能力包和说明书一起走，第三方工具的接入成本被压到接近零。\n- 对 MCP 生态是结构性利好：工具作者第一次可以把「我这东西的最佳用法」直接打包分发，而不是指望用户读文档。\n\nhttps://x.com/bcherny/status/2125292098165612585\n\n---\n\n### OpenAI Codex 与 ChatGPT 的 Thibault Sottiaux (thsottiaux on X)\n**一句话：给 ChatGPT Business 团队两个小福利：额度重置（banked reset）和 fast mode 免费用到 12 月 31 日**\n\n- 动作不大但方向清楚：企业版在年底前把「快」当成白送的功能，抢的是团队日常使用的黏性，而不是单点能力。\n- 他自己那句「Have fun!」也说明这是拉活跃的运营手段，不是产品发布会级别的东西。\n\nhttps://x.com/thsottiaux/status/2125299248782778588\n\n---\n\n### AI 教程作者 Peter Yang (petergyang on X)\n**一句话：他用一个周末把 Gemini 4 Neon 加 Antigravity 这套组合摸成了一门免费课，最有说服力的细节是「某个时刻我同时有 42 个 agent 在跑」**\n\n- 三个真正好用的点：Orchestrator 和 /swarm 负责多 agent 的规划与构建；/grill-me 是内置 skill，先逼它反问把计划问清楚再动手；远程控制比 Claude Code 更好，因为每个 thread 默认就是活的，可以把 Antigravity 加到手机主屏当遥控器。\n- 他的用法重心已经从「模型写得好不好」移到了「编排得顺不顺」，42 个并发 agent 这件事本身就是新工作方式的证据。\n\nhttps://x.com/petergyang/status/2125246815884984398\n\n---\n\n### Meta AI 高级总监 Madhu Guru (realmadhuguru on X)\n**一句话：他把 Jensen 这一周的舆论当成一场公开实验，结论是「自信和正确之间几乎没有相关性」，而信息生态正在不对称地奖励确定、快速和嚣张**\n\n- 他的观察很具体：一堆知名 VC、分析师和专家用十足的把握预测事情会怎么走，几天内就来回翻转，而且每次翻转依然同样自信。\n- 他点出了激励结构的问题：「我不知道，看看会怎么发展」这种话根本换不来流量，所以人们倾向于先站队再大声宣布。\n- 方法上的建议很实在：听任何「专家」评论时都要意识到，对方心里的把握远低于语气；这轮新闻也是给「长期又响又错」的人做的一次校准。\n\nhttps://x.com/realmadhuguru/status/2125355549202194801\n\n---\n\n### Replit CEO Amjad Masad (amasad on X)\n**一句话：他的判断是「美国可以造出最好的前沿模型，却输掉全球 AI 竞赛」，所以 Jensen 回归的意义远在 Nvidia 之外：各国要的是能跑在自己土地上的主权 AI，美国公司不供，中国公司就供**\n\n- 他用了华为的类比：一旦一个国家的电信基础设施围绕你的设备建起来，技术能力、供应商关系和后续投资都会跟着沉淀，替换成本高到美国政府现在掏钱帮人拆都拆不动。\n- 所以开源模型是战略资产，不是慈善：它既让创业公司有得选，也让各国有一个「在美系技术上建设自己」的理由。前沿领先和全球采用，两样都得要。\n- 另一条关于需求的判断值得记住：token 需求不像电力那样平滑增长，而是随着 harness 创新一级一级跳，autocomplete → chat → agent → 长时自主 agent → swarm，每一级解锁一个数量级的潜在消耗，只是工具和用户学会用它之间总有滞后。\n- 产品侧还有一条：3B 的本地 Muse 模型，小到能跑在本地。\n\nhttps://x.com/amasad/status/2125353849057853876\nhttps://x.com/amasad/status/2125287538911072753\nhttps://x.com/amasad/status/2125414100692041797\n\n---\n\n### Vercel CEO Guillermo Rauch (rauchg on X)\n**一句话：他解释了为什么在 2026 年还要发布一个 CLI：因为它只是 libfx 的一层薄壳，目标是把 coding agent 内核做到最小、最聪明，并且能嵌进任何界面**\n\n- 他列出的目标载体很说明野心：浏览器、服务器、手机、桌面、操作系统、各类 ADE。换句话说，agent 不该是某个应用，而该是一个可以塞进任何地方的内核。\n- 顺手还开源了一个背景效果生成器（bg effect builder），延续他一贯的「先做出来给你看」的风格。\n\nhttps://x.com/rauchg/status/2125320020666565096\nhttps://x.com/rauchg/status/2125426206183239770\n\n---\n\n### Box CEO Aaron Levie (levie on X)\n**一句话：他提出一个真正新鲜的观察：AI 的采用率不是按公司算的，同一家公司内部不同团队的产出差距可以到 10 倍**\n\n- 过去的技术扩散是以公司为单位评估的，比如「这家公司上云了」，所以 uplift 在各团队之间大致平均；AI 不一样，差距取决于团队有没有把流程重新设计成适合 agent 跑的形态。\n- 现在这种分化高度集中在写代码，但更多工作会变成「coding 邻近」，所以同样的分化会扩散到其他职能，公司内部会出现很野的动态。\n- 一年前这话听起来不现实，如今基于模型和 harness 的进步，10 倍产出已经是可以讨论的量级。\n\nhttps://x.com/levie/status/2125442246543814686\n\n---\n\n### Y Combinator 总裁 Garry Tan (garrytan on X)\n**一句话：他给「为什么 AI 落地没那么快」两个解释：一是模型能力已经超过了部分客户的实际需求，二是社会吸收技术的能力撞到了上限，人不喜欢自己的奶酪被挪动**\n\n- 他没把话说死：即便模型今天就能干这些活，agency 和 taste 上大概还有一级台阶可走。\n- 这两条放在一起，等于把瓶颈从供给侧挪到了组织侧：真正慢的不是模型，是流程和人的习惯。\n\nhttps://x.com/garrytan/status/2125247943540142577\nhttps://x.com/garrytan/status/2125247972158193792\n\n---\n\n### FirstMark 资本合伙人 Matt Turck (mattturck on X)\n**一句话：他用一句反讽把当下的估值情绪写清楚了：Anthropic 都快六年了，还没 IPO 就已经是「勉强万亿美金公司」**\n\n- 这句话能当温度计用：万亿成了新的「还行」基准，说明市场的心理锚点已经被抬到了这个位置。\n\nhttps://x.com/mattturck/status/2125275072802029631\n\n---\n\n### Zara Zhang (zarazhangrui on X)\n**一句话：她给了一个判断产品定位质量的量化近似：用大白话解释一个产品需要多少字，和它的定位清晰度成反比**\n\n- 这条规则可以立刻拿来当自查工具：如果你的定位需要三句话以上才说得清，问题多半不在文案，在产品本身还没想明白。\n\nhttps://x.com/zarazhangrui/status/2125256097925865639\n\n---\n\n### fpv Ventures 合伙人 Nikunj Kothari (nikunj on X)\n**一句话：他用一组「2026 年路演一句话」把整条 AI 栈的自负写完了：掌握 workflow、harness、推理、模型、数据、infra、芯片、电力的人，各自都认为自己掌握宇宙**\n\n- 笑点背后是个真问题：每一层都能理直气壮地说自己是价值捕获点，恰恰说明现在没人说得清利润最终会停在哪一层。\n- 另一条他引了 Ratatouille 的台词，「不是每个人都能成为伟大的艺术家，但伟大的艺术家可以来自任何地方」，用来提醒天赋无法按出身或履历归类，创始人、操盘手和投资人都是如此。\n\nhttps://x.com/nikunj/status/2125376105024758112\nhttps://x.com/nikunj/status/2125270251491520702\n\n---\n\n### OpenClaw 作者 Peter Steinberger (steipete on X)\n**一句话：他做了一年复盘：OpenClaw 在 prosumer 和企业采用上找到了自己的位置，多人协作是最好的功能，而「把免费开源做得可靠」是最难的部分**\n\n- 他说得很坦白：每天早上醒来面对一堆用户抱怨，是情绪上的挑战，好在团队现在接走了大部分工作。\n- 这一年的重心放在无聊的部分，快、可靠、安全，例外是新的记忆系统和即将到来的 OpenClaw ID。\n- 他准备假期写一篇博客把这一年讲清楚。\n\nhttps://x.com/steipete/status/2125422797304549672\n\n---\n\n### smol.ai / Cognition 的 Swyx (swyx on X)\n**一句话：他转了一份做 agent 产品时要提前想清楚的清单，比讨论模型能力更接近工程现实**\n\n- 清单包括本地与云端的环境和沙箱、session 与 conversation 存储的区分、用户审批收件箱、流式监听、给所有人用的 artifacts，以及 dashboard 的各种配置组合。\n- 这些条目听起来琐碎，但每一条都是把 agent 从 demo 变成产品的必经坑。\n\nhttps://x.com/swyx/status/2125431392226148670\n\n---\n\n## 🎙️ 播客精选\n\n### Unsupervised Learning — Ep 98: China Expert on Jensen's Return\n**回归不是结局，是交易的开始：Jensen 真正的风险从来不是被炒，而是那条刚落地、要求九十天内切断中国远程算力通道的规则会不会被撤掉**\n\n- **先把事实链条摆清楚**：Nvidia 想摆脱只服务几家超大规模云客户的客户结构，中国超大规模厂商有钱没芯片（华为产能跟不上），所以 Jensen 四年来一直在保这条通道；而 Blackwell 级芯片从来没有合法进入中国的途径。Jordan Schneider 用银行业类比：制裁合规早年也是「谁会管」，直到财政部用几十亿美元罚款逼出真正的合规体系。而半导体设备业和 Nvidia 走的是完全相反的方向，规则说不能卖 100，就造一个卖 99 的型号。\n- **他的判断是「主罪」不是绯闻**：真正的问题是对走私的系统性视而不见，Super Micro 高管用吹风机撕标签这种细节就是证据；绯闻只是让其他人开始认真看的导火索。原话很直接：Jensen 最大的问题不是那件事，而是「turning a blind eye（睁一只眼闭一只眼）」。\n- **时机有奥卡姆剃刀解释**：中期选举之后才引爆，一是这故事对共和党极其难看，二是十月让标普跳水不如选后再说。而真正促成回归的杠杆是股价，跌到 125 附近，市场恐慌比「中国拿到先进芯片」更让白宫紧张。\n- **规则才是关键变量**：上周五落地的规则做三件事，堵走私、要求台积电代工先进芯片需商务部批准、九十天后禁止马来西亚等地的新云继续服务中国客户。这条远程通道大概占中国算力的五分之二。\n- **一个反直觉的判断**：两党在芯片问题上的强硬是真实且跨党派的，所以「总统给了豁免，故事就结束了」是错的，参众两院和州层面的立法压力才刚开始。他想的是让西方 AI 生态比中国更强更活，而不是让某一任总统开心。\n- **他也泼了行业的冷水**：他说自己最喜欢的一项民调是，「希望 AI 更快发展的美国人占 2%」。这不一定是未来两年的阻力，但到 2029 年两党候选人都会说「慢一点」，那时留给这些公司改变叙事的时间窗已经很窄。钱也解决不了，花五亿美元照样没能左右德州一场选举。\n- **对中国生态的观察同样锐利**：一篇讲「中国 AI 最黑暗时刻」的文章火了又被删；至于在中国采机器人或生物数据的公司，他把「中国对机器人数据上出口管制」定在 75% 的概率，凡是会成为筹码的数据，都会被当成筹码。\n- **机器人现场很惨**：在 CORAL 大会上，DeepMind 花了几十亿的机器人勉强捡起一个松饼，全场当成奇迹。更麻烦的是模型之外那 80%：硬件、磁材（全球 99.5% 在中国）、稀土，都不是模型能力能解决的部分。\n- **他赌下一个紧急播客是什么**：「中国版 Hugging Face 时刻」，或者一次美国网络大事故。而更长的主线是立法反弹，这是慢火。\n\nhttps://www.youtube.com/watch?v=gkd5eOQGASU\n\n---\n\nGenerated through the Follow Builders skill: https://github.com/zarazhangrui/follow-builders\n"</script>
