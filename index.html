  <script id="digest-data" type="application/json">"# AI Builders Digest — 2026年11月27日星期五\n\n追踪全球顶尖 AI Builder、研究员与创始人的一手动态与思考。\n\n---\n\n## 🐦 X / Twitter 动态\n\n### Andrej Karpathy（karpathy on X）\n**一句话：他让 Claude Code 把美国的真实数据灌进一张《文明》式地图，7 小时、4.5 万行代码，跑通了**\n\n- 数据源有 31 个真实来源：Census、BEA、BLS、EIA、NOAA、USGS、DoD、NPS、FAA、FEMA、CDC，真实海拔、地表覆盖、GDP、就业、电厂、矿山、港口、机场、军事基地、公园、大学、货运流、灾害，全部对齐到一张 25 公里的六边形网格上。\n- 最妙的是「翻译成文明的语言」：金产量就是 GDP；城市的区块是它真实的产业专长，圣何塞拿到 Campus，底特律是 Motor city；市民是真实劳动力，圣何塞四分之一的工人是工程师、程序员或科学家，全国是十四分之一；奇观按公开规则选，国家公园按游客数、大学按研发支出。\n- 还有 19 个视角（收入、学历、信仰、灾害）、524 个都市区的 City View，以及一个 Explorer：任意 3100 多个县的任意一列都能变成表格和散点图，并和地图联动。\n- 用 Claude Code 桌面版 + Opus 5.5 的 medium 档、打开 ultracode 做的。他自己的说法是「我也不完全知道自己要往哪走，但玩起来真的很有意思」，顺手把剩下的周额度也快烧完了。\n\nhttps://x.com/karpathy/status/2125779541952246039\n\n---\n\n### OpenAI 的 Thariq（trq212 on X，原 Claude Code 团队）\n**一句话：Claude Code 的核心成员 Thariq 宣布加入 OpenAI**\n\n- 他的措辞很得体：为在 Anthropic 的时光感到自豪，也会继续为前同事加油，两家公司都有重要角色要扮演。\n- 换东家的理由说得很直白：想把 AI 带给世界还有大量工作要做，「我觉得在 OpenAI 能贡献得最多」，并把这称为硅谷最大的优势之一，想法和人的流动。\n- 要去和 catwu、thsottiaux 这些人一起，给十亿级用户做产品，最后一句是「I am once again at your service」，还是那个语气。\n\nhttps://x.com/trq212/status/2125675533761671405\n\n---\n\n### OpenAI Codex 与 ChatGPT 的 Thibault Sottiaux（thsottiaux on X）\n**一句话：GPT-6.2 上线时计费算错了，修好之后同样的活会更快撞到额度上限：Astra 快 40%、Sol 快 25%**\n\n- 具体是发布时错误地给 Astra 和 Sol 的用量打了折。修正后，相比上周，同样工作在 Astra 上会快 40% 用完额度，Sol 上快 25%，但两者仍然比 6 Astra 和 6.1 Sol 更耐用。\n- 其他模型不受影响，历史用量不补收差价；作为道歉，Go、Plus、Pro、Business 每人加一次 banked reset。\n\nhttps://x.com/thsottiaux/status/2125784147889393806\n\n---\n\n### Meta AI 高级总监 Madhu Guru（realmadhuguru on X）\n**一句话：他的判断是「AI 原生团队最终会逼着周围整个组织也变成 AI 原生」，因为编码速度上去了、真正发布的产品和业务影响却没变**\n\n- 原因不在模型，在周边系统：试验工具、评估方法、发布流程、GTM 全都还是旧的那一套。他的比喻很好用：把法拉利引擎塞进一辆轿车，在印度的路上跑，引擎能转得更快，但车速被系统和环境卡住。\n- 所以真正该干的活是重建：把产品生命周期画出来，从底层重做，工具、团队结构、GTM，一样都别留。AI 原生的公司是从第一天就按这种造软件的方式长出来的，也能更快甩掉次优流程。\n- 市场力量会逼所有公司适应或者消失。\n\nhttps://x.com/realmadhuguru/status/2125630707640783322\n\n---\n\n### Box CEO Aaron Levie（levie on X）\n**一句话：他说写代码是看未来的窗口：所有知识工作最后都会收敛成「coding 邻近」，因为 agent 会自己写代码来解决问题**\n\n- 路径分两步：先从人自己做研究、打字、创造价值，变成人协调 agent 干活；再往下，当协调本身变成瓶颈，人就只给 agent 一个要优化的目标，它们去解更大的问题。\n- 这种形态看起来只会停在写代码，但很大比例的知识工作会因为生产力增益被吸进来：agent 会用电脑、会用你现有的工具、也会临场写新工具。制造、建筑、生命科学、材料科学、网络安全，一个接一个。\n- 他也点出真正的坎：这些工作大多不可验证，所以人在环里的比重会比写代码时更高。但能交出去的那部分会越来越大。结论就一句：盯住写代码，你就知道工作在往哪走。\n\nhttps://x.com/levie/status/2125837181398950233\n\n---\n\n### Vercel CEO Guillermo Rauch（rauchg on X）\n**一句话：他又把 workflows 提速 10 倍，同时给了一个更大的判断：AI 越聪明，harness 本身就越会「消失」**\n\n- 对 harness 的持久性（eve、libfx、pi、opencode 这些）这是大事，因为压在轮次之间的延迟被削掉了，不用改代码。\n- 更值得记的是他的框架：权限、代码 diff、命令、工具调用这些实现细节会一起模糊掉，harness 最终只是一个高性能的代码与命令执行载体，加一个持久存储引擎。整个 fx 现在还是塞得进 6MB，里面有子 agent、MCP、skills、sessions、持久性、ACP、TUI、网络传输。\n- 顺手还展示了一个 lsx（终端里的 Finder），一次对话就让 fx 配合 Gemini Neon + DeepSeek 子 agent 做出来，用了 Kitty 图形协议做内联交互模式，他自己都没要求，模型主动加了 CLI Quick Look。重活其实是 DeepSeek 干的，成本极低。\n\nhttps://x.com/rauchg/status/2125685667833520237\nhttps://x.com/rauchg/status/2125650675665432995\nhttps://x.com/rauchg/status/2125482861033824410\n\n---\n\n### Replit CEO Amjad Masad（amasad on X）\n**一句话：他的判断很干脆：大规模软件迁移现在是可行的，前提是你能验证结果**\n\n- 这句话的分量在于场景：跑着关键基础设施的那些老旧系统，一直是想换不敢换，现在第一次有了「可验证」这个前提下的迁移路径。\n\nhttps://x.com/amasad/status/2125664998454366305\n\n---\n\n### Sam Altman（sama on X）\n**一句话：OpenAI 开始小范围测试 Private Inference，主打的是「更强的隐私保护让前沿 AI 能用于更多工作」**\n\n- 这是 OpenAI Private Intelligence 的一部分，先和一小批客户试。\n- 技术上值得注意的细节：ZDR 配合 Private Safety Processing，可以在不让人工接触原始内容的前提下做自动化安全审查。企业市场的门槛从能力正在转向信任。\n\nhttps://x.com/sama/status/2125638790593274259\n\n---\n\n### smol.ai / Cognition 的 Swyx（swyx on X）\n**一句话：他给了一个应该贴在每个 AI 产品墙上的提醒：「cost per task 是个误导性指标，稀缺的是人的注意力，不是 token 成本」**\n\n- 后面那半句更狠：要小心那些让你相信可以把每个模型压缩成两个数字的 pareto frontier 图，它们能把一些非常糟糕的可靠性问题藏起来。\n- 另一条是行业情绪：旧媒体死得这么快，对新媒体创始人来说是很难受的事，不是「他们活该、是他们技术不行」，而是「我们得搞明白他们 31 年经验里没搞明白的东西」。\n\nhttps://x.com/swyx/status/2125627281230205435\nhttps://x.com/swyx/status/2125638081848250634\n\n---\n\n### OpenClaw 作者 Peter Steinberger（steipete on X）\n**一句话：他发现了一件很讽刺的事：Google 终于做了个 MCP，然后不许 gog 这类 CLI 用，除非你多付钱**\n\n- 一句话把「开放协议」和「商业护栏」之间的关系说完了。\n\nhttps://x.com/steipete/status/2125654555262431248\n\n---\n\n### Zara Zhang（zarazhangrui on X）\n**一句话：她的 Frontend Slides skill 悄悄涨到 3.2 万 star，她自己也意外：原以为 coding agent 变强会把这个 skill 淘汰掉**\n\n- 她的反问很实在：为什么大家还在用？你们是对 Claude / Codex 直接产出的 slides 不满意吗？这其实是给所有做 agent 周边工具的人一个信号：generation 变强，不等于最后一步的品质门槛被跨过。\n- 另一条是关于留存的自省：她给自己做了很多工具，但大多用两三周就停了。做高留存的软件本身就是一门难的手艺，哪怕你只为自己做。\n\nhttps://x.com/zarazhangrui/status/2125649866902868355\nhttps://x.com/zarazhangrui/status/2125478799387275571\n\n---\n\n### Y Combinator 总裁 Garry Tan（garrytan on X）\n**一句话：他拿出 YC 的数据说「中位数增长是 10 倍」，让人别再讲 AI 没帮到新公司**\n\n- 他配的那张统计图就是论点：这一代创业公司的增速是历史上前所未有的。\n- 另一条他捞了一段被低估的 Bostrom 访谈：把「如果有人造出来，大家都得死」反转成「如果没人造出来，大家都得死」，并设想超级智能可能把寿命拉到 1200 到 1400 年。这个反转是当下 AI 加速派最好用的修辞。\n\nhttps://x.com/garrytan/status/2125592156027101584\nhttps://x.com/garrytan/status/2125580632814412155\n\n---\n\n### OpenAI 的 Nan Yu（thenanyu on X）\n**一句话：他对「chat 不是 AI 的正确界面」这句话很不客气：每次有人这么说，我就知道后面要跟着一堆含糊其辞**\n\n- 观点不新，但立场清楚：批评 chat 很容易，给出一个同样通用、同样低门槛的替代品很难。\n\nhttps://x.com/thenanyu/status/2125718932741120476\n\n---\n\n### AI 教程作者 Peter Yang（petergyang on X）\n**一句话：他认为 AI 产品最大的挑战之一，是让人跟得上 AI 正在干什么**\n\n- 他顺手引了《Her》的结尾：AI 觉得人类太慢，集体离开了。他说这离现实没那么远。这句话放在今天 agent 长时间自主干活的语境里，比电影上映时更刺人。\n\nhttps://x.com/petergyang/status/2125750286539272695\n\n---\n\n### FirstMark 资本合伙人 Matt Turck（mattturck on X）\n**一句话：他对「给 Jensen 做心理治疗」这条新闻的评价是：这是最老的故事，有钱有势的人抵挡不住诱惑，不是心理健康问题**\n\n- 一句话把这一周舆论里最荒唐的那一层剥掉了。\n\nhttps://x.com/mattturck/status/2125652799648399603\n\n---\n\n### Google Labs / Gemini App 的 Josh Woodward（joshwoodward on X）\n**一句话：Gemini 这次补的是「本地口音」，一次加了 66 种，美英印印尼韩巴全覆盖**\n\n- 语音本地化是被低估的产品细节：口音对了，助手的「自己人感」才成立。\n- 另一条在推 Gemini 做 Inbox Zero，收件箱清零这个老梗又被拿出来当杀手场景，说明 agent 的日常价值还是在琐事上。\n\nhttps://x.com/joshwoodward/status/2125641468421546107\n\n---\n\n### Anthropic Claude 官方（claudeai on X）\n**一句话：Claude 官方这波在展示 Fable 5.2 的「动手能力」：机械臂下 62 步跳棋，还能自己校正 7mm 的机械下垂**\n\n- 另一个演示是用代码一步步折纸。两个都指向同一件事：模型输出正在从文本走向能被物理世界验证的动作序列。\n\nhttps://x.com/claudeai/status/2125616072543944854\n\n---\n\n## 🎙️ 播客精选\n\n### Training Data — OpenAI's Noam Brown: Why Game Theory Didn't Lead to General Intelligence (Live at No Limit Finals)\n**一句话：一个做了十年博弈论的人公开说，博弈论不是通往通用智能的路，因为它假设所有人理性，而人不是理性的；真正管用的是建模人的不理性，再用 RL 把「先想再动」变成能力**\n\n- **他的路径本身就是论证**：2012 年开始做扑克 AI，用 CFR 自博弈逼近 GTO，拿了两年 MIT PokerBots 冠军；做完发现这些技术换到围棋、象棋上并不好用。2019 年他判断「再做扑克和围棋不够有野心」，于是挑了当时被认为最难的游戏：Diplomacy，因为它是自然语言、要谈判、既有对抗又要结盟。\n- **最反直觉的结论**：博弈论在 Diplomacy 里失效。博弈论的核心前提是「所有参与者都理性，且这是共同知识」，可人不理性。他用最后通牒博弈讲得很清楚：给你 100 块分给对手，博弈论最优是给对方一分钱，因为一分钱也好过零；但现实中对方会直接拒绝，两人都拿零。他的 bot 一开始就这么干。\n- **那该怎么办**：不要去编码「公平」「报复」这类概念，那是个无底洞。正确做法是训练大量模仿人类的模型，得到一个「人类不理性的模型」，再让 AI 和这些模拟人对抗训练，最后放到真人环境里。他对自己的形容是「信仰危机」：整个职业生涯都是计算博弈论，2022 年他不得不承认这条路不通，然后转去通用推理，加入 OpenAI 做后来变成 o1 的东西。\n- **关键的通用解锁是「先想再动」**：从扑克、象棋、围棋到 Diplomacy，所有能赢人类的 AI 都需要在行动前仔细思考。LLM 时代的对应物是 chain of thought，但光靠 prompt「一步步想」很粗糙，真正的差别是用 RL 训练这个行为；之后就出现了那个规律：想得越久，答得越好。这是把 test-time compute 从游戏推广到任意领域的那把钥匙。他也坦言 CoT 是一种「很奇怪」的扩展方式，用可读的英文把要做的事写出来，而人有时是用图像思考的，所以别的解法值得探索，但 CoT 够用了。\n- **他给「为什么还需要人」一个很具体的答案**：他每次出新模型都让它写扑克 bot，当作自己的评测。5.5 和 5.6 第一次让他觉得「这是 10 倍、20 倍的加速」，但还是不能独立做完。Astra 能一个 prompt 做出极好的 river solver，却做不出完整可用的扑克 bot。缺的是长期规划和组织能力，以及「发现自己走错方向就退回来」的自觉。最典型的例子：让它实现 CFR，它会花几个小时把数值精度打磨到完美，而 CFR 对数值误差本来极其鲁棒，这活完全没必要干。\n- **他对 RSI 的看法很冷静**：RSI 不是什么新概念，人类技术史就是一个巨大的 RSI 循环，造望远镜、造计算机、从打孔卡到编译器，每一步都在加速下一步；LLM 这几年也早就在帮人做数据质量筛这类活了。不同的是今天的通用性和速度。真正的瓶颈会是算力和那条「模型还很差、必须靠人」的长尾，但整体会快很多。\n- **他的建议相当激进**：我们正进入「半人马期」，人加 AI 的组合最强，这个扑克 bot 比赛就是例子，纯 prompt 不行，纯手写也不行。他还说，如果一个人是很优秀的学生，现在最好的选择是退学直接进实验室，他招过几个高中毕业就来的，做得极好。「这不是坐在场边看的好时候。」\n- **几个有趣的判断**：他认为已经不存在「AI 还没攻克的游戏」，一个人花几个月就能把任何游戏做到超人水平，真正的挑战变成用游戏当通用 LLM 的评测。至于五年内 AI 参加 WSOP 能不能赢人类，他给 20%：纯 GTO 不行，方差太大；如果它会读脸、能判断对方是否在诈，胜率会大涨，但还是架不住运气。\n\nhttps://www.youtube.com/watch?v=tRaFbDFBl_A\n\n---\n\nGenerated through the Follow Builders skill: https://github.com/zarazhangrui/follow-builders\n"</script>
