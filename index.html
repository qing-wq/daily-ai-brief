  <script id="digest-data" type="application/json">"# AI Builders Digest — 2026年11月21日星期六\n\n追踪全球顶尖 AI Builder、研究员与创始人的一手动态与思考。\n\n---\n\n## 🎙️ 播客精选\n\n### No Priors — Superintelligence Needs the Physical World with CEO and Co-Founder of Arda Bob McGrew\n**超智能不会在数据中心里长出来：如果那些「天才」只能坐着发邮件，它们就被困住了。真正的补集不是更聪明的模型，而是感知、行动和造东西的能力**\n\n- **先把「硬起飞」这个论证拆了**：自动化 10% 的研究工作→一点提升，50%→两倍速度，99%→100 倍速度，于是失控自我改进。Bob McGrew 说这个推理「straightforwardly wrong」——因为研究者从来不是瓶颈。2024 年他在 OpenAI 当首席研究官时，真正的限制因素是手上的 GPU 数量、算力有没有连成对的网络，而不是能招到多少研究员。\n- **他给了一个很具体的量化框架**：把 GPU 想象成一台机器，现在大概只发挥了「最优状态」的 35%，自动化研究也许能把它推到 90%；但从 90% 到 99% 的差别其实不大。所以自动做研究是一次性的 S 曲线加速（类似从无推理到有推理），不是自我改进的循环，推完之后还得去找下一件事。\n- **一句来自 Ilya 的提醒**：早年他兴奋地给 Ilya 讲论文里的方法多漂亮，Ilya 耐心听完只问一句「so what are the results?」深度学习是门实验科学，绝大多数想法都得跑实验才知道行不行。\n- **推土机悖论**：想建数据中心但缺推土机→那就建个推土机工厂→建工厂第一步要清地→又需要推土机。同理，盖房子最难的不是画图，是拿批文（「no amount of agents are gonna help you do that」）。这就是经济学里的 O-ring 生产函数：所有环节都得成，速度由最慢那环决定。\n- **美国制造业的真实痛点不是不会设计**：iPhone 背面写着 designed in California，每年 75% 的零件会换，于是只有那 25% 不变的部件是高度自动化的，剩下 75% 靠手工。因为今天造自动化设备的方式是「为一台机器定制一个专门解」，这台机器既不跨机型泛化，也不跨代泛化。\n- **Arda 的目标定义得很硬**：把产品设计上传到云上，7 天内设计并重构出一条自动化产线。参照系是人——重训一个工人只要一天，制造业认为「7 天能把设计变更推上产线」就已经算极其敏捷。\n- **不需要人形机器人**：他们要替代的是站在产线上的人，不是替代汽车厂那种巨大机械臂。两条手臂加一个摄像头就够，很多工位一条手臂就够。而且机械臂的灵敏度早就不是瓶颈了，瓶颈是 CapEx——这些机器每年要重新设计重建一次，太贵。\n- **开放世界 vs 封闭世界的分野**：收拾卧室是开放世界问题，没见过的东西、不回头的地方、长时序规划，需要接近人类的智能；装配线是封闭世界，重复、无新意，所以传统自动化才吃得下。传统产线像鲁布·戈德堡机械：斜槽、振动杯、夹具把零件摆到绝对确定的位置，一个毫无感知的机械臂去拿。一半功夫在设计，另一半在标定。\n- **他们的解法是把感知和 RL 塞进这个封闭世界**：零件偏一点不用标得那么精，可以直接抓、可以拧；从最简单工位开始，逐步吃下「弹性件要套到密封圈上」这种难活。但要记住封闭世界的容错率是 99.9%，不是「漏几件也没事」。\n- **和 Anduril 的合作节奏**：公司注册前一天去聊，1 月拿到系统权限，4 月就有了第一个用户——一位要虚拟 build 执行器的工程师，原本要几天，用了他们的软件 90 分钟做完。现在覆盖对方所有产品部门，从无人机到导弹，正在做 Fury 协同作战飞机。\n- **「我们要做制造业工程师的 Cursor」**：但制造业工程师没有 IDE，所以得先造 IDE——把散在 100 份文档里的制造流程收敛成单一事实来源，做成带「制造业版 Git」的真数据结构，然后在上面叠 agent。往左可以做面向制造的设计反馈，往右可以直接设计自动化工作站。\n- **为什么不自研模型**：前沿模型最适合当 orchestrator，真正的价值在 motion planning、CAD 检查这些专业工具上。他的判断是：不是前沿实验室的话，做小而专用的模型比通用模型更好用，而且「训一个小模型、写一个软件包、写一个工具，本质是同一个动作」。\n- **FDE（前置部署工程）不是咨询**：2005 年在 Palantir 成形，「没有客户准备用，我就不开发这个功能」。先找一个愿意一起受苦的 power user——当年整个机构只有 Sarah Adams 一个人用了一年。Crossing the Chasm 讲了要 sponsor，但没讲你还需要一个真的愿意用的 user。\n- **「大组织」是个幻觉**：OpenAI doesn't want anything，Sam 想要某件事，Greg 想要某件事，某个团队的研究员想要某件事。大公司就是很多小团队的集合，只能一队一队、一个问题一个问题地推。\n- **终局视角**：他很喜欢 Dario 那句「a country of geniuses in a data center」，但补了一刀——如果这些天才只能坐在机房里互发邮件，它们什么都做不了。智能变便宜之后，稀缺的是感知和行动。所以未来十年不会是一支人形机器人军队，而是形态大爆发：会飞的、四条腿的、扛货的、下地的。\n- **顺手给了费米悖论一个答案**：最有效的文明扩张方式是到一个恒星系、快速建厂、造一堆自复制探针以光速撒出去。我们之所以没看到，是因为那波浪潮本身以光速前进，我们只会在它抵达前几分钟或几年前才发现它。「也许我们就是那波浪潮。」\n\nhttps://www.youtube.com/watch?v=_wLzJINt9iQ\n\n---\n\n## 🐦 X / Twitter 动态\n\n### Swyx (swyx on X)\n**X 的激励结构在奖励不准确：说「SOTA 概率归零」能拿一波赞，三个月后模型做到了再发个道歉表又能拿一波赞**\n\n- 他的观察是这套玩法没有任何后果：说错不用付代价，夸张永远有回报，算法本身就在奖励这种模式。建议刷社媒时把这个前提放在心上。这句话其实是给所有「模型要完了 / 模型封神了」的帖子做的一次元评论。\n\nhttps://x.com/swyx/status/2123591875349422435\n\n---\n\n### OpenAI Codex 与 ChatGPT 负责人 Thibault Sottiaux (thsottiaux on X)\n**ChatGPT 要在 12 亿用户身上原地换一次体验：移动端重构，Codex 和 Projects 可以直接钉到底栏**\n\n- 新的移动端体验先从 Pro 用户开始（有 dot 或符合创建条件的用户），dot 有自己的 tab，Codex、Projects、Images 等可以 pin 到 tab 栏，部分用户会默认看到新设计，随时可在 Settings > New ChatGPT Design 里关掉。\n- 他自己给这次改版的定性是「Le ChatGPT 2.0」，并承认团队「疯到认为可以在 1.2B 用户的使用中把体验改好」——能不能成，还要看这套策略跑不跑得通。\n\nhttps://x.com/thsottiaux/status/2123557171321561133\nhttps://x.com/thsottiaux/status/2123612433923051976\nhttps://x.com/thsottiaux/status/2123612889416339762\n\n---\n\n### Google Labs 与 Google 副总裁 Josh Woodward (joshwoodward on X)\n**Mac 版 Gemini 现在能直接在你的电脑上替你操作**\n\n- 这是社区呼声最高的功能之一：Gemini app 在 Mac 上可以执行电脑上的任务。对桌面 agent 这条线来说，是把「聊天」推进到「代你动手」的一步。\n\nhttps://x.com/joshwoodward/status/2123534862569324703\n\n---\n\n### Peter Yang (petergyang on X)\n**Gemini 4 Neon 和 Opus 5.5 实测：Neon 在写作和性格上已经打平甚至更好，日常 99% 的活他只想用 Neon**\n\n- 他的结论分三层：Opus 在 3D 和设计上仍然更强，但 Neon 在写作与「有人味」这件事上打平甚至更好，他认为这是很了不起的成就；Gemini 4 名义上有三个模型，但实际用起来 Neon 就够覆盖 99% 的任务，比 Carbon 快很多而效果不差；100 美元/月的 Gemini Ultra 订阅「是捡漏」——含 Gemini 4、YouTube Premium Family、20TB 存储。\n- 另一条是替 Google 说了句公道话：大家嘲笑它臃肿官僚，但 10 万+ 员工本身就是竞争优势——模型和工具在正式发布前有足够大的内部样本，甚至能跑出统计显著的员工专属 A/B 测试。\n\nhttps://x.com/petergyang/status/2123540875733315815\nhttps://x.com/petergyang/status/2123648490844897389\n\n---\n\n### Vercel CEO Guillermo Rauch (rauchg on X)\n**「工程还有没有价值」的新算法：结果导向的创造性工程师是 1000x，纠结空格还是 Tab 的是 -10x，普通知识工作者是 2x**\n\n- 他说这套分层也被 token 消耗分布印证——创业公司和企业的用量都指向同一件事：工程师和「软件工厂」会指数级地消耗 token。他还给了个结论：Anthropic 的成功说明编码是 AI 的头号杀手级应用。\n- 另一个产品判断是 Vercel board：它故意不做重量级、有主张的 UI，因为「UI 现在是免费的」。他喜欢「headless Slack for agents」这个类比——安全团队要的是漏洞数、SEV 分级、确认与未确认，这种界面可以每个用例现生成现部署，甚至有内部工厂就是一个 TUI 或者干脆全交给 Slack agent。他把 board 定位成「agent 的 Redux 状态管理器」，是基础设施而不是产品。\n- 还有一句短的：「一家公司的起点，是那个帮你把公司建起来的 agent。」\n\nhttps://x.com/rauchg/status/2123505400591106113\nhttps://x.com/rauchg/status/2123468825538789380\nhttps://x.com/rauchg/status/2123553975945556144\n\n---\n\n### Replit CEO Amjad Masad (amasad on X)\n**一个 prompt 就能搭出自己的 Muse 式个人 agent；「和你的 agent 签合同」这个范式会被很多人抄**\n\n- 他把「与 agent 签订契约」当成一个值得押注的新范式，认为这会是别人从 Replit 抄走的东西。同时把门槛降到一句话：想要一个类似 Muse 的个人 agent，一个 prompt 就够。\n\nhttps://x.com/amasad/status/2123535544718418191\nhttps://x.com/amasad/status/2123535362568134894\n\n---\n\n### SPC 合伙人、Bevel Health 联合创始人 Aditya Agarwal (adityaag on X)\n**Agent 正在从「单个任务」走向「整份工作」，所以数据也得跟上**\n\n- 他推的 Fig RoleCUA 做的事是：跨数月真实工作给专家角色建模，每个动作都绑定它服务的那项任务和目标。这句话背后的判断很实际——任务级的 agent 只解决了执行，工作级的 agent 需要能解释「为什么做这一步」的数据结构。\n- 另外两条是给 Anthropic 的祝贺，信息量在于人：SPC 的目标不只是让人去创业。Tom Brown 2016 年带着零 ML 背景进 SPC，天天和别人一起啃论文，后来共同创办了 Anthropic；Thariq 则是刚关掉自己的游戏公司进来做可解释性，被同伴问了一句「你试过 Claude Code 吗」，之后就在帮着造那个大多数人每天都在用的工具。「把有野心的人放在一起，会有超出预期的事发生，有时候影响要几年后才显形。」\n\nhttps://x.com/adityaag/status/2123479646629183631\nhttps://x.com/adityaag/status/2123494873919783073\nhttps://x.com/adityaag/status/2123579739868959110\n\n---\n\n### fpvventures 合伙人 Nikunj Kothari (nikunj on X)\n**谁来保护老人？他把「反冒充诈骗」拆成了四层，而且指出真正的买家是子女**\n\n- 第一层在浏览器：短信最终都会落到一个链接上，连付款也是，所以浏览器是关键，需要有人做一个能保证访问站点安全的浏览器。第二层在网络：类似 Pi-hole 的实体设备，或者手机上的 Onavo 式 VPN，直接拦掉可疑站点。第三层在支付：看起来像诈骗的交易在钱离手前被标记。第四层最激进：整机监控，只有亲人能打进来，克隆语音交给 Reality Defender 这类厂商识别。\n- 关键洞察在商业模式：今天各层都有零散方案，但没人打包；他设想打包成一份保险来覆盖 OS 或手机上的相关行为，让激励对齐在边缘侧。买单的人是子女——「像我这样的人，出事时被通知」。\n\nhttps://x.com/nikunj/status/2123426647273800172\n\n---\n\n### Every CEO Dan Shipper (danshipper on X)\n**同一个问题，问得很直接：现在谁在解决基础设施层面的攻击，AI 圈的人能怎么帮？**\n\n- 和 Nikunj 那条放在一起看更有意思：一边在问「谁来防守」，一边在画防守的商业结构。\n\nhttps://x.com/danshipper/status/2123435061236404385\n\n---\n\n### 前 Claude Code 团队成员 Thariq (trq212 on X)\n**软件既是艺术也是工具，AI 既是工业革命也是文艺复兴**\n\n- 他的框架是：工厂负责 utility，那 art 谁来负责？他在 AIE Code 讲的就是「怎么把艺术做得更好」。这个二分法比单纯讨论「AI 会不会取代工程师」更有意思——流水线化的是效用，品味和判断力反而是稀缺项。\n\nhttps://x.com/trq212/status/2123524052195463568\n\n---\n\n### OpenClaw 作者 Peter Steinberger (steipete on X)\n**给 OpenClaw 的嵌入式 harness 修了个问题，但大多数 harness 还没跟上**\n\n- 修的是给那些用内置 harness（而不是 codex，因为它是插件）的用户准备的问题，昨天已经落地；他也提到目前多数 harness 还没更新。\n\nhttps://x.com/steipete/status/2123487048250327497\n\n---\n\n### Y Combinator 总裁 Garry Tan (garrytan on X)\n**「如果没人去造它，所有人都得死」——他对 Bostrom 这句话的回答是「hard agree」**\n\n- 一句话的立场：在加速和安全之间，他明确站在「必须有人去建」这一侧。\n\nhttps://x.com/garrytan/status/2123496208316694669\n\n---\n\nGenerated through the Follow Builders skill: https://github.com/zarazhangrui/follow-builders\n"</script>
