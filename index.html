  <script id="digest-data" type="application/json">"# AI Builders Digest — 2026年11月24日星期二\n\n追踪全球顶尖 AI Builder、研究员与创始人的一手动态与思考。\n\n---\n\n## 🎙️ 播客精选\n\n### AI & I by Every — A New Vision for Human Work After Automation\n**一句话：Dan Shipper 说「AI 会取代人」这个结论，来自只看聚合曲线的视角；镜头拉近到具体的人就会发现，generation 已经变得免费，真正稀缺的是「你负责哪块世界 + 你用什么视角去排序」，这就是团队和人在 AI 时代的价值**\n\n- **两种预测未来的方法**：aggregate（聚合）收集海量数据外推趋势线，客观、量化、极其强大，scaling law 就是它的产物；intimate（贴身）是放大看一个真实案例，理解里面所有的混乱和相互纠缠的变量，再外推。我们的文化天然更信 aggregate，而他认为 aggregate 会漏掉一些只有贴近才看得见的东西。\n- **一个让人后背发凉的数字**：OpenAI 的 GDPval 基准里，专家从自己的真实工作里挑任务、写成 prompt，让模型和不用 AI 的人各做一遍，再由盲评专家判谁更好。2024 年 GPT-4o 赢了 12.4% 的场次，2025 年 47.6%，2026 年约 83%（GPT-5.4）。他的原话是「这个 benchmark 我怀疑已经饱和了」。\n- **他自己的一周就是那张表**：分析了季度客户调研（本来需要数据分析师）、给全员大会做了个实时小游戏（本来需要游戏开发）、从中发现把 Every 卖给团队的机会（本来需要产品营销）、又 vibe code 了一个自己的 CRM 去发邮件（本来需要工程师加 BDR）。2020 年这是五个人的活、二十万美元的价，他用一个 Claude 订阅在日程的缝隙里全做完了。\n- **他给这种冲击起了名字**：agency rupture。我们把自我认同绑在所做的事情上，所以看到模型做出和自己一样的工作时，被打到的其实是自我。\n- **但同一个工具，四个人四种收获**：他把同一份调研数据发给全团队。Yash（GTM 工程师）看到的是首月付费用户因为邮件太多而流失；Douglas（市场负责人）看到的是很多读者「很孤独」，因为身边没人理解他们为什么这么痴迷 AI；Jack（资深编辑）做了一档黏土动画版 Family Feud 游戏节目来解释结果。\n- **关键实验是「生成便宜，排序很贵」**：评估负责人 Mike Taylor 试图预测 Dan 在 Slack 里会说什么，命中率 93%，但前提是 Claude 一次给 400 个答案，其中一个必然正确；一旦要求它排序，正确答案落进前 10% 的概率只有约 60%，基本是抛硬币。\n- **这解释了团队的真正价值**：你有一块明确负责的世界（责任），它决定你去哪儿找；你有自己的视角，它决定你把什么捞出来、认定它重要并为之负责。上百万个可能的洞见，责任负责缩小搜索域，视角负责点亮其中几个。\n- **「2026 年的 Yash 打不过 2027 年的 Claude」是个假命题**：2027 年的 Yash 会带着新经验，并且也在用 2027 年的 Claude；而右边那个 Claude 也得有人启动、有人搭 harness，所以真正比较的是「带着视角用模型的 Yash」对「默认 prompt」。等式两边都有 Claude，可以约掉。\n- **他真正押注的判断**：模型能力是地板，地板在抬高，但地板会分发给所有人，于是默认答案越来越不值钱；alpha 在于你用责任和视角把模型推到哪儿。地板会不断吃掉今天的 alpha，但只要你一直在用最新的模型，你的视角就一直在新的地板上生效。\n- **这是他 2024 年写的 allocation economy**：原话是「你不再因为知道多少而被评判，而是因为你能不能把智能这种资源分配和管理好、把事做成」。如果这个判断成立，衡量 AI 的方式也该翻过来：从「它在大家公认值得解决的问题上有多强」（数学、编程，因为可验证）转向「它在我这个视角下、我的工作里有多强」。\n- **一个很锋利的收尾**：aggregate 为了测量模型进步，必须把人类冻结在 2020 年；intimate 才能让你看见自己可能造出什么、成为谁。\n\nhttps://www.youtube.com/watch?v=WstNofgQF5Q\n\n---\n\n## 🐦 X / Twitter 动态\n\n### OpenAI CEO Sam Altman (sama on X)\n**一句话：他提出给前沿模型开发者设一条行业共同上限，用跨实验室可比的指标（他倾向 perplexity）来度量，在「我们理解和监控模型行为」的能力达到某个具体里程碑（比如 CoT monitor 的继任者）之前，承诺不越过这条线**\n\n- 具体提议有两层：前沿模型的开发方应共同建立评估模型、在首次投入使用前对安全案例做红队的共享规范，包括共享的透明度标准；在此之上再设公共上限。\n- 他明确不用算力口径。原文是「我进一步提议，基于 perplexity 和其他测量设定共同上限，开发方承诺在我们理解与监控 AI 行为的能力达到某个具体里程碑之前不去越过它」，并说希望这个标准能指定「第一条开发限制、一个跨实验室可跟踪的关键指标，以及越过它之前我们必须先做到什么」。\n- 他还把这件事接到了政策轨道上：各实验室已经在 White House Accords 下同意建立提升系统安全性的标准与最佳实践，他认为接上 perplexity 的讨论能推进这些目标。\n- 最有信息量的地方在于他把「指标」当成治理工具：先有一个大家共用、能跨实验室跟踪的量，才谈得上自律和节奏控制。\n\nhttps://x.com/sama/status/2124551883130114403\nhttps://x.com/sama/status/2124558713646428663\n\n---\n\n### smol.ai / Cognition 的 Swyx (swyx on X)\n**一句话：OpenAI 想把 perplexity 变成行业自律的通用标尺，而 swyx 的第一反应是量化体感差：如果按这条曲线算，2026 这一年的 AI 进步比 2022 到 2025 加起来还多，可「感觉不像」**\n\n- 他引的那套论证很值得记住：新能力的出现主要靠压缩（compression）的进步，所以一个 rooted in perplexity 的指标可以作为通用智能的共享基准，与开发过程自动化到什么程度无关；按近期趋势外推，进入约 0.68 到 0.7 的 log-perplexity 区间就该预期更颠覆性的能力。\n- 他的评价是：这张图是讲过去四年故事最漂亮的方式之一，同时也说明我们天天争论的 post-training 问题，其实只是大尺度预训练这条 A 情节旁边的 B 情节。\n- 他另一条推荐的是一份创始人复盘：从创立到被收购的完整历程，连带后悔和教训，包括 IP assignment 的坑、别炫耀你的 SEO、怎么引起 Naval 的兴趣、招聘与裁员的建议、怎么「钓」到一个收购方、怎么清掉收购路上的路障。他的感叹是：愿意把这些写下来的创始人太少了，写出来能替别人省下很多痛苦。\n\nhttps://x.com/swyx/status/2124583459356373052\nhttps://x.com/swyx/status/2124590240539259381\nhttps://x.com/swyx/status/2124730733147390347\n\n---\n\n### Vercel CEO Guillermo Rauch (rauchg on X)\n**一句话：他给「AI 该往哪儿优化」提了个反直觉的方向，不是艺术性而是人类可理解性；同一天他把「免费 stealth model」直接点名成工业规模的数据外泄通道**\n\n- 关于这两天刷屏的黎曼证明，他的要求很具体：证明应该附带论文、可走读的过程、新概念和新洞见。他的类比是「即便 LLM 能直接输出 CPU 指令，我们依然需要高级语言这种中间表示」。\n- 另一条更狠：那些号称「免费、ZDR、stealth model」的推理服务，他强烈怀疑是工业规模的数据外泄、最终流向国家级项目，并说 Dragos 的研究看起来印证了这一点。他的模拟对话是：怎么跟老板解释「我就是想试一下这个很酷的免费模型，结果我们的代码、客户数据和秘密现在都在另一个大洲了」。\n- 他补了自己的立场：Vercel AI Gateway 是靠真实 token 量堆起来的，没走这些捷径，接下来还要把信任、隐私和安全的门槛再抬一档。\n\nhttps://x.com/rauchg/status/2124654108124848350\nhttps://x.com/rauchg/status/2124595496849445079\n\n---\n\n### Box CEO Aaron Levie (levie on X)\n**一句话：当 agent 从「跑一个任务」变成「一群 agent 并行推进一个长期项目」，真正难的不是编排框架，而是它们怎么共享知识、怎么和人类协同，以及怎么在「给够资源」和「暴露太多」之间找到那条线**\n\n- 他认同被引的那套判断：agent harness 和编排架构必须演进。理论上这些都「技术上讲得通」，但要把它做对，复杂度极高。\n- 可以借鉴的东西其实已经在人类协作里：人们共享文件、各有电脑、在聊天和收件箱里形成共同体。但这些 primitive 必须支撑远超人类的吞吐量，而且是在一个 agent 很容易变成安全风险载体的世界里。\n- 他的判断是这既是横向平台的机会，也是垂直行业的机会，「构建下一代 agent 运作方式会非常好玩」。\n\nhttps://x.com/levie/status/2124658150771188157\n\n---\n\n### Every CEO Dan Shipper (danshipper on X)\n**一句话：他对一起航空事故给出了一个很冷的假设，如果那是 AI 辅助的网络攻击，那么让 9/11 之后所有防人肉劫机的措施失效，只需要让飞机和飞行员无法确认自己的重量、剩余燃油和位置**\n\n- 他先声明「我一般不爱危言耸听」，然后补上推理：在不知道更多信息的情况下，也该预期这类小规模攻击是在摸边界、试探什么是可行的。\n- 他也留了余地：自己不是航空系统专家，也知道多数飞机有手动超控，但在能见度很差的时候这依然极其棘手，并公开请懂行的人来纠正他。\n\nhttps://x.com/danshipper/status/2124567533449613819\n\n---\n\n### Replit CEO Amjad Masad (amasad on X)\n**一句话：Replit 把「桌面 AI 应用是安全与隐私噩梦」当成产品机会，跟 Windows 一起做了套安全模型，并拿 Christie's 这个客户做背书**\n\n- 他的原话是：桌面 AI 应用普遍是安全与隐私的噩梦，Replit Desktop 的安全模型是和 Windows 合作交付的。\n- 结果层面的信息量在客群：Christie's（全球最重要的珍稀艺术品托管方）选择 Replit 做安全的 agentic 工作。这说明 agent 产品的采购标准正在从「能不能做」转向「敢不敢让它碰核心资产」。\n\nhttps://x.com/amasad/status/2124604574606795002\n\n---\n\n### OpenAI Codex 产品负责人 Nan Yu (thenanyu on X)\n**一句话：他给所有 vibe coding 项目的「秘密 prompt」只有一个词，用 Postgres**\n\n- 他说这条能让 vibe code 出来的项目扩展性更好、性能更好、可靠性更高。\n- 这种一句话的技术建议之所以有信息量，是因为它点出了 AI 生成代码最常见的隐性债：状态管理和数据层几乎总是被糊过去。\n\nhttps://x.com/thenanyu/status/2124592238974156861\n\n---\n\n### Peter Yang (petergyang on X)\n**一句话：他抓到 Microsoft Copilot 负责人一句很关键的话，agent 是非常苛刻的客户，而且它想要的和人想要的不是一回事**\n\n- 引述 Microsoft Copilot 的 EVP Clamanna：agent 会看性能、价格和可靠性，而「agent 的偏好不总是人的偏好」。人做一次搜索，你给他 10 条结果加小摘要就行；agent 不在乎，你可以还它一千条结果。\n- 推论很直接：我们的 API 和用户体验会长出专门服务 agent 的模式。这和 Levie 那套「agent 编排要重做」是同一个方向，只是从接口层看。\n\nhttps://x.com/petergyang/status/2124669298191090033\n\n---\n\n### Cursor / Notion / Stripe 前设计师 Ryo Lu (ryolu_ on X)\n**一句话：他把一个 iOS 原生 karaoke 应用几乎一把做完，顺手演示了折叠屏的新用法：把 iPhone Duo 半折起来就是一台迷你卡拉 OK 机**\n\n- 关键在于「almost one-shotted」：原生 iOS 应用，靠 AI 编程工具一次成型，这类 demo 正在把「一个人做一个 App」变成常态。\n\nhttps://x.com/ryolu_/status/2124473853858725907\n\n---\n\n### FirstMark 资本合伙人、MAD Podcast 主理人 Matt Turck (mattturck on X)\n**一句话：他对这波「AI 攻克最难数学问题」的刷屏只回了一句反话，AI 连最难缠的数学问题都没解决，那这些在 pre-product 阶段就以超过 10 亿美元估值进场的 VC，将来靠什么把钱还给 LP**\n\n- 另一条是城市观察：2026 年某个时点，科技公司的街头广告彻底占领了纽约，每块广告牌、每节地铁车厢、每辆出租车，让这座城市看起来像旧金山。他说「不能说我爱这个变化」。\n\nhttps://x.com/mattturck/status/2124671699245257037\nhttps://x.com/mattturck/status/2124515224946422095\n\n---\n\n### fpv Ventures 合伙人 Nikunj Kothari (nikunj on X)\n**一句话：两条行业情绪贴，一条是「最烂的 cold email 长这样」，一条是 2026 年的 Docusign 股东此刻有多得意**\n\n- 两条原帖都是图片加一句吐槽，没有更多可提炼的判断，但情绪本身挺说明当下融资与 SaaS 市场的温差。\n\nhttps://x.com/nikunj/status/2124646168428966181\nhttps://x.com/nikunj/status/2124597844808196252\n\n---\n\nGenerated through the Follow Builders skill: https://github.com/zarazhangrui/follow-builders\n"</script>
