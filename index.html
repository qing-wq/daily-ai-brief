  <script id="digest-data" type="application/json">"# AI Builders Digest — 2026年11月12日星期四\n\n追踪全球顶尖 AI Builder、研究员与创始人的一手动态与思考。\n\n---\n\n## 🎙️ 播客精选\n\n### Latent Space — Designing for Agents：Resend 创始人 Zeno Rocha 谈邮件这门\"脏活\"\n**一个不懂邮件的前端，用设计 + DX 撕开了一个十工程师打不动的老行业：435 万用户、12 万付费客户、1000 万美元 ARR，SDK 的 NPM 下载量已是 SendGrid 的两倍**\n\n- **\"天真\"是最大的优势**：Zeno 是写 CSS、HTML5 的前端，没有一天基础设施或邮件经验。他看不惯注册就要填发送量、等两天人工审核、大概率被拒的流程，于是把摩擦全部搬到平台自己身上。三年后他承认现在懂了别人为什么这么做（欺诈、钓鱼、滥用太多），但依然选择\"默认信任，发现异常立刻拦截再沟通\"，因为绝大多数情况是技能问题，不是恶意滥用。\n- **发信是一门反侦察的手艺**：给 10 万人发信，Gmail 会限流并盯着最初那批互动。所以要把最活跃的收件人排到队首、分批、错开不同邮箱服务商、自己买 IP 段、按历史声誉分池并动态调度；滥用者买新域名、用仿冒域名、一次性群发后就消失，而信誉要的是\"持续、递增地发\"。原则只有一条：你要做的事，正好是滥用者不会做的事。\n- **一个自动生成的纯文本版本，把送达率拉了一大截**：他们从 HTML 自动生成 markdown 纯文本一起发，\"垃圾过滤器可以直接读内容，不用解析 HTML\"。同时坦言打开率这个指标已不可靠（Apple 隐私保护会预读邮件），只能转向点击率；而点击追踪绝不能用第三方域名改写链接，否则一个滥用客户就能把你整个域名拖进黑名单，几天到几周出不来。\n- **MCP 不是死话题，是每月翻倍**：第一个 MCP 是 a16z 的 Yoko 业余写的开源本地版，Zeno 直接把仓库要过来收进组织。月调用量从 50% 环比增长变成每月翻倍，8 月已破 120 万次；工具数从 20 多个加到 80 多个。为了做远程版被迫重做整个权限模型（OAuth、RBAC、每类资源的访问控制）。他的判断标准很消费者化：官方不维护的 MCP 我就不用，为此把 Plausible 换成 PostHog；跑步数据留在 Strava，也是因为 Strava 有官方 MCP。\n- **AEO 的具体打法**：每个页面加 FAQ、全站每个页面提供 .md 版本、上 llms.txt。起因是某个周日他让模型比较各家定价，模型把 Resend 算错还点评\"定价不透明\"，因为 agent 不会执行 JavaScript 价格计算器；他把价格表做成 markdown 版本，几天后答案就对了。他也在重新做底层：买 IP 段、发信链路从 JavaScript 换成 Go，因为现在换语言太便宜了。\n- **金句**：\"我宁愿活在 1000 万美元 ARR、女儿天天缠着我玩的世界里，也不想活在 1 亿美元 ARR、女儿不想跟我玩的世界里。\" 他讲到 YC 时一位 partner 直言他\"太在乎设计了，否则会走得更快\"，他难受了几天，最后决定照自己相信的做，因为那个行业里所有人的产品都很丑，设计就是差异化。\n\nhttps://www.youtube.com/@LatentSpacePod\n\n---\n\n## 🐦 X / Twitter 动态\n\n### Anthropic Claude 官方账号 (claudeai on X)\n**Claude 从\"对话窗口\"变成\"工作台\"：Whiteboards、Sheets、Claude Data 正式可用，第三方应用直接在对话旁打开**\n\n- Claude Data（原 Dashboards）向所有付费计划 GA，除了看板，还能根据指标自动起草数据故事和带旁白的视频；认证查询与实时分享在 beta。\n- 交互式连接器让你在对话旁边直接打开 Adobe、Atlassian、Box 的完整应用，自己改，或者让 Claude 跟你一起改，Web 与桌面端逐步放量。\n\nhttps://x.com/claudeai/status/2120206375137484875\n\n### Google VP Josh Woodward (joshwoodward on X)\n**Gemini 4 Carbon 全球上线，先给 Ultra 订阅用户**\n\n- 已进入 Gemini App，面向全球 Ultra 订阅者开放。\n\nhttps://x.com/joshwoodward/status/2120186249281778135\n\n### Every CEO Dan Shipper (danshipper on X)\n**Gemini 4 Carbon 的 Day-Zero 实测：编程大涨但不知道何时该停手**\n\n- 编程基准一项得分 44%，对比 Argon 的 21%，仍是中游；给它一份 bug backlog，它自己判定 6 个可做，最后做了 15 个，其中还包括别人正在做的事，4.5 小时后被强行叫停。\n- 建造类任务很强：靠录音棚的 3D 扫描和设备清单，一次就做出能判断新设备会不会入镜的浏览器模型，还写了内部视频编辑器 Everycut 一次大更新约 95% 的代码。音视频能抓到其他模型漏掉的剪辑问题，6 段会议短片自带标题。\n- 设计两极分化：图标与 3D 场景比 Argon 好，界面被吐槽\"盒子套盒子\"；写作与 Argon 基本持平，但更贵。结论：给它一个带明确终点的大任务，然后审结果，也适合当第二意见。\n\nhttps://x.com/danshipper/status/2120187507396530309\n\n### Box CEO Aaron Levie (levie on X)\n**两个判断：agent 处理企业文件将是人的 100 倍；下一跃是 agent 集群**\n\n- Box 与 Anthropic 合作，通过 MCP 把 Box 内容的完整读写能力接进 Claude：不只是取文件进工作流，还能把修改写回 Box 并在 Claude 里直接查看，合同、演示、战略文档都能改。\n- 他把 AI 产出分成三个阶段：chat 让交互变快但受限于人；agent 能独立做完整个任务，把几小时几天压成几分钟；agent 集群（swarms）以目标为导向自己找路径，生产力提升不再有内在上限。凡是价值由\"能研究多少、能用工具做多少决策、能处理多少数据、能生成多少代码\"决定的领域都会被重塑：游戏、编程、交易、生命科学、IT 自动化、安全、数学、动画。新的岗位是帮企业把工作这样接起来，也就是一整片 FDE 市场。\n\nhttps://x.com/levie/status/2120385739342897469\n\n### Vercel CEO Guillermo Rauch (rauchg on X)\n**安全扫描上线不到一周：5.7 万个漏洞，其中 1.4 万个 agent 已自动修完**\n\n- Vercel Security Review 一周内识别 57,897 个漏洞，6,029 个严重或高危，14,665 个已被 agent 修复；任何仓库都能开，不限于部署在 Vercel。\n- 他的另一层判断：Rust 是很棒的语言，但它是\"agent 编程出现之前\"发明的；有了 agent，为特定场景定制的语言会大量出现，甚至 C、LLVM IR、汇编都可以按需选择。AI 是流动的，不再有一刀切的方案。\n\nhttps://x.com/rauchg/status/2120188488628977819\n\n### 前 Claude Code 团队 Thariq (trq212 on X)\n**\"我们需要更少的一次性 demo，更多能跟你协作的工具\"**\n\n- 他的批评指向当前 AI 产品的主流演示方式：一键生成一个惊艳成品，然后你无法继续参与。真正有价值的是让人和模型在同一条创作路径上共同推进，把你的意图做出来。\n\nhttps://x.com/trq212/status/2120223476279869875\n\n### 前 Cursor 设计师 Ryo Lu (ryolu_ on X)\n**\"各自养一支 agent 军队、彼此隔离\"是反模式**\n\n- 他认为魔法发生在人和人一起工作的时候，而不是每个人在自己的孤岛里指挥一支 agent 部队。软件也不只是为了优化和完成任务，而是为了造一个让人进来、去渴望做不到的事、去创造并找到自己的世界，就像电影人和音乐人那样。\n\nhttps://x.com/ryolu_/status/2120337691661443081\n\n### Peter Yang (petergyang on X)\n**游戏圈对 AI 的敌意是愚蠢的，但前提是\"有品味地用\"**\n\n- 他同意 Kartik 的看法：用 AI 批量生产 slop，和把 AI 当作又一个工具做出好游戏，是两件完全不同的事，行业不该混为一谈。\n- 另一条更值得记：他不在乎 Anthropic 的股价，但如果它能加速那些可怕疾病的治愈进程，那会是历史上最有影响力的公司之一，他很高兴 Dario 把注意力放在这里而不是赢短视频和 TikTok 梗。\n\nhttps://x.com/petergyang/status/2120320377163501817\n\n### Zara Zhang (zarazhangrui on X)\n**用户不回来，80% 是因为忘了你的产品存在，不是不喜欢**\n\n- 她把留存拆成两个完全不同的失败模式，绝大多数团队把资源全押在\"更好用\"上，却忽略了\"让他想起来\"。另一条是给创作者的第一步：别等做完做完再发，先发一个进行中的版本，有时你就是靠这个判断它值不值得做完。\n\nhttps://x.com/zarazhangrui/status/2120235104194932841\n\n### OpenAI Codex 产品负责人 Nan Yu (thenanyu on X)\n**被低估的细节：听写可以映射到 Apple 的听写键**\n\n- 除了全局听写本身，他们支持把 Apple 听写键（F5 的特殊变体）映射过来，也支持按住说话、单击、双击多种快捷方式，这些边缘体验很少有听写产品做对。\n\nhttps://x.com/thenanyu/status/2120203450223104012\n\n### OpenAI Codex & ChatGPT 负责人 Thibault Sottiaux (thsottiaux on X)\n**\"实验室一起创新才是赢\"**\n\n- 他转发 Claude 交互式连接器发布时只写了一句 \"Labs innovating together ftw\"，同一时间段他还抛出一个问题：你们有多少人在做小生意，明显是在为下一步的产品方向试水。\n\nhttps://x.com/thsottiaux/status/2120266880963473789\n\n### Peter Steinberger (steipete on X)\n**\"GPT-6 Astra 又在 700 套系统里翻出 3.5 万个新漏洞，我们真的累垮了\"**\n\n- 他引述一则报道：某机构对约 700 套系统做诊断时发现 10,500 个漏洞，开了紧急发布会、花三个月修完；换用 GPT-6 Astra 重跑后，又确认了 35,000 个新漏洞。模型的诊断能力提升，正在把过去\"看不见的债\"变成必须处理的清单。\n\nhttps://x.com/steipete/status/2120228665946710248\n\n### Swyx (swyx on X)\n**AI Engineer 大会本周开场，以及\"为什么我的 agent 总是选 Resend\"**\n\n- 他提前看了某场 keynote，\"签了保密协议才拿到这个演讲，而且这还不是全部\"，直播时间为两天 9:00–18:00。\n- 另一条直接给本期播客做了注脚：他终于当面问了 Resend CEO Zeno Rocha，为什么自己的 agent 明明不想用、却总在推荐 Resend，这一问题也构成了那期对谈的起点。\n\nhttps://x.com/swyx/status/2120260228902264872\n\n### FPV Ventures 合伙人 Nikunj Kothari (nikunj on X)\n**\"这份事故复盘是每个基础设施厂商的必读\"**\n\n- 他用 MLK 那句\"衡量一个人的终极标准，不是他身处安逸时的立场，而是面对挑战与争议时的立场\"来推荐 Railway 团队的公开复盘，并称赞他们的透明度。对基础设施生意来说，出事后怎么写复盘，本身就是产品的一部分。\n\nhttps://x.com/nikunj/status/2120386979389157530\n\n---\n\nGenerated through the Follow Builders skill: https://github.com/zarazhangrui/follow-builders\n"</script>
