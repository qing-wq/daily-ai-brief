  <script id="digest-data" type="application/json">"# AI Builders Digest — 2026年11月19日星期四\n\n追踪全球顶尖 AI Builder、研究员与创始人的一手动态与思考。\n\n---\n\n## 🎙️ 播客精选\n\n### Latent Space — Building Visual Intelligence — Andreas Blattmann & Dustin Podell, Black Forest Labs\n**BFL 从来不是一家图像生成公司：图像只是把「视觉智能」这门生意跑通的跳板，他们真正要造的是看一次就会动作的世界模型——两位创始人给出的时间表是「2027 是机器人元年」**\n\n- **起点是一篇博士论文**：latent diffusion 是 Andi 和 Robin、Patrick 在海德堡与慕尼黑读博时做出来的，三个人都是物理背景，觉得「把扩散这个物理现象映射到生成建模」有种哲学上的美感，后来被放大成了 Stable Diffusion。BFL 这个名字来自德国黑森林——创业时没人规定实验室必须开在旧金山，他们就选在了出生地弗莱堡。\n- **Dustin 是另一条完全不同的路**：写了十年普通软件，Midjourney V1 让他觉得「这方向成了」，Stable Diffusion 发布当天他就在洛杉矶的软件工作室递了辞呈。进 Stability 时他是工程师不是研究员，靠「把感兴趣的东西拆到不能再拆」的偏执蹭到闲置算力、读论文、复现，最后做到 SDXL、Control LoRA、SD3 的 post-training。\n- **SDXL 的 refiner 有个从没公开的来历**：那其实是一个训练到 post-training 阶段、但结构很差、最终没发布的另一个架构；因为它在高频细节上更好，团队干脆把它拆出来专门做精修。Dustin 说「我到现在还有点不甘心，我当时想让一个模型把一切都做好」——现在他改主意了，因为他见过系统级的模型协作能做出什么。\n- **SD3「终于能写字」的答案很扫兴也很重要**：Andi 说这不是 DiT 的功劳，是更好的建模加更好的数据。「你训练时每个样本都需要 caption，如果 caption 不描述画面里的文字，模型就永远学不会。」他补了一句：简单、可扩展，几乎总是最有效的。\n- **视频这条线他们早就押了**：Andi 在 NVIDIA 就做过 Align Your Latents，把 latent diffusion 映射到视频。Stable Video Diffusion 那篇论文里最让他兴奋的不是数据配比，而是——**只用纯 2D 视频预训练的模型，再用 1K 步 3D 数据微调，就能得到一个 3D 模型**。这说明 2D 视频里已经藏着巨量的三维理解，只是没人显式建模过。\n- **离开 Stability 的动机说得很直白**：他们看到了自己的模型在世界上产生的价值，也看到「在 Stability 我们没法把模型的价值变现」。带着这套判断，13、14 个人在法国一个 chalet 里闭关一周，那一周 Dustin 搞出了让模型一致性大幅提升的东西，这就是 BFL 的 founding offsite；三个月后 Flux.1 发布。\n- **商业数字**：累计融资 4.5 亿美元；去年 12 月公开的是 1 亿美元收入，Andi 说「之后已经超过了」。他强调这不是转型，是延伸——「做视频你要懂物理怎么演化，做艺术你也需要这种视觉智能」。\n- **Flux Context 是一个人起家的**：Dustin 在 offsite 上提出「模型已经懂可乐罐在桌上、帽子在狗头上这些空间关系，只要把数据做对，很少的训练就能把通用图像编辑唤出来」。他做了一版只描述图像内简单关系的小数据集，训了四到六个小时就看到明显泛化——「那基本是个数据集项目」，之后才是公司级投入和蒸馏。遗憾是只支持单图编辑，到 Flux.2 才把参考图做到 10 张。\n- **一个反直觉判断**：arena 和人类偏好数据在这个阶段已经没信号了。「你让我把排名前五的模型都拿去删掉一张床，它们看起来都一样。」真正要解决的是可控性（controllability），而不是再刷一轮偏好投票。\n- **Context Bench 的来源很有人味**：他和同事深夜在旧金山办公室后院，拿图配最蠢的 prompt 编出来的，公开版删掉了内部版里「太蠢」的部分。他的方法论就是「玩你的模型」——很多今天正经的生产用例，当年都是有人在 Discord 里玩出来的，比如老照片修复，是他们完全没预料到的大场景。\n- **Flux.3 是一个多模态底座**：图像、视频、音频、动作一起训，再派生出 video、video edit、action、image 和 4K 视频放大器。「训练通用模型的好处是会复利。」\n- **机器人这块数字很具体**：Flux.3 Action 只有 7B（为了上机、实时），跑 10 FPS，一次预测 9 到 21 帧的动作 chunk，没有高层 planner，就是模型自己在闭环里跑；和 Dyna Robotics 合作，工业场景 4 小时数据就能到可用成功率，比开源基线省 8 倍数据。他们真正想要的是机器人的 in-context learning——「给机器人看一次动作，它就该会做」，Andi 直接给了年份：2027。\n- **自回归 vs 扩散，两人都不站队**：自回归训练时数据效率更高（每个 token 都能并行拿梯度），扩散在采样时可以蒸馏到 4 步；所谓「会说话」的编辑能力不是自回归的专利，nano banana 更接近 transfusion。Andi 还提到他们已经在纯扩散模型上跑 GRPO 式 RL，Flux.3 上收益很大。\n\nhttps://www.youtube.com/watch?v=8cGfJOU3AlQ\n\n---\n\n## 🐦 X / Twitter 动态\n\n### Swyx (swyx on X)\n**「你要的不是 AI 员工，是拥有结果的 agent 经理」——Devin Bots 才是多 agent 团队的正确形态**\n\n- 他把 Devin 的新形态拆成五条：always on 且对 ROI 敏感的主动、拥有结果而不是任务、自己管理子 agent 并自我 review、到处可用（文本、Slack、直接 hello 叫它）、用交互式 artifact 而不是长对话来汇报。\n- 最值得抄的是那句反「AI 员工」的判断：我们还没有 AGI，过度承诺和过高预期只会让你失败；真正该要的是「比单任务高一级的抽象」。他顺带说，这也是他区分「有 agency 的人」和「只做我交代的事的人」的标准。\n- 关于 6.2 Astra，他先骂广告再夸模型：效率是当前三大 RL 目标之一，OpenAI 在这块世界领先，他已经日常使用，Latent Space 和 AI Engineer 的内容流水线跑在上面，「没有它我们不会有 >1M/人的收入效率」。\n\nhttps://x.com/swyx/status/2122746401482592549\nhttps://x.com/swyx/status/2122818291144229075\nhttps://x.com/swyx/status/2122862646265520150\n\n---\n\n### OpenAI CEO Sam Altman (sama on X)\n**6.2 Sol 和 Astra 发了：很聪明、很省 token，但「好不好相处」还没做完**\n\n- 他的原话是：虽然新模型非常聪明，但「让模型变得好用、好相处」还有工作要做，会在接下来的版本里优先处理；即便如此，智能和能力是「非凡的」。另一条专门推 6.2 Sol ultrafast，说人们会很喜欢。\n\nhttps://x.com/sama/status/2122798039899263456\nhttps://x.com/sama/status/2122798042734633452\n\n---\n\n### OpenAI Codex 与 ChatGPT 负责人 Thibault Sottiaux (thsottiaux on X)\n**为什么今天 KOL 和群众的体感差这么多？因为那些视频是上周录的**\n\n- 他的解释很具体：几周前给了少数人早期权限，但最近 3-4 天模型改了很多，那批视频是上周做的，中间没有重新测试。他也承认模型虽然比 GPT 前代是大跳，但远不完美，taste 和好用程度上还有团队自己想改的地方。\n- 另外他推荐 Pro 200/500 用户试试 6.2 Sol ultrafast，「完全是另一种手感」，并说会把这种速度推给更多用户。\n\nhttps://x.com/thsottiaux/status/2122929634916679820\nhttps://x.com/thsottiaux/status/2122929829863735594\n\n---\n\n### Google Labs 与 Google 副总裁 Josh Woodward (joshwoodward on X)\n**Gemini 开始在六个国家免费替你把事做完，而且开始碰真实世界**\n\n- 三个更新：跑在新的 Gemini 4 Hydrogen 上，美国、日本、韩国、加拿大、澳大利亚、印度数亿用户免费用；功能上开始接真实动作——用 Google Duplex 打本地商家电话、用 Google Pay 付款结账、在 Android/iOS 上用 RCS 给 Gemini 发短信、把邮件转发给 Gemini、用密码管理器登录网站而不外泄密码。\n- 另外是 Workspace 集成迄今最大的一次更新：工具触发更可靠，起草发送邮件、建改 Docs 和 Sheets、一次加多个日历事件，都能在 Gemini 里做完。\n\nhttps://x.com/joshwoodward/status/2122737427970425171\n\n---\n\n### Replit CEO Amjad Masad (amasad on X)\n**Agent swarm 是 AI 的下一个 scaling 前沿，现在在 Replit 上是一句话的事**\n\n- 他的框架是：这些年我们靠更大的模型和更长的思考时间扩展智能，但还有另一个维度——并行跑很多 agent，各自探索不同路径、互相挑战，最后解决单个 agent 很难发现的问题。OpenAI 在数学上的突破已经证明了这条路。\n- 以前想自己试要搭复杂的编排基础设施，现在在 Replit 上一个 prompt 就能起一群——「让集体机器智能变得人人可编程」。\n\nhttps://x.com/amasad/status/2122809964649459861\n\n---\n\n### Vercel CEO Guillermo Rauch (rauchg on X)\n**自优化的软件来了：agent-browser vitals**\n\n- 他判断 agent-browser vitals 对 web 性能是件大事，用词是「self-optimizing software is here」。\n- 另一条是 OpenAI 刚发布的是「世界上网络安全能力最强的模型」，并强调 Vercel 的 DeepsecBench 是个 stealth cyber benchmark——没有任何实验室能拿到这些代码库去训练，所以这个信号很干净。\n\nhttps://x.com/rauchg/status/2122812237169426606\nhttps://x.com/rauchg/status/2122830064152899991\n\n---\n\n### Every CEO Dan Shipper (danshipper on X)\n**这是难得一次值得逐项打分的模型发布**\n\n- Every 团队给 Astra 和 Sol 6.2 打了完整评分，他的评价是「很难想起有哪次前沿模型发布是这样的，Opus 5 是最接近的对照」。\n- 另外他推了「反向 Roon bench」，以及一个观点：如果团队还在用 deck 讲新方向而不是直接生成视频，「ngmi」。\n\nhttps://x.com/danshipper/status/2122858139989012510\nhttps://x.com/danshipper/status/2122852558007894417\n\n---\n\n### FirstMark 合伙人 Matt Turck (mattturck on X)\n**Daytona 第一个给出 macOS 沙箱；顺手投了一家做持续学习的公司**\n\n- Daytona 现在提供 macOS 沙箱，直接对着两个场景：computer-use agent 在 Mac 上操作，以及构建和测试 Apple 应用。\n- 他和 EQT 共同领投 Remanence Labs 3000 万美元种子，主题是「让智能产生复利」——持续学习。\n\nhttps://x.com/mattturck/status/2122726760185741673\nhttps://x.com/mattturck/status/2122717441461739571\n\n---\n\n### fpvventures 合伙人 Nikunj Kothari (nikunj on X)\n**模型风向的 yoyo 太疯狂了：前几个月是 OpenAI 的，现在是 Anthropic 5.5 和 Gemini Carbon**\n\n- 他的观察是 X 上的模型情绪几个月一轮回，OpenAI 一度握着权杖，如今赞誉都给了 Anthropic 的 5.5 和 Gemini 的 Carbon，然后直接点名 grok：该你给大家一个惊喜了。\n\nhttps://x.com/nikunj/status/2122833396787495317\n\n---\n\n### Peter Yang (petergyang on X)\n**Astra 6.2 在网站设计上可能已经比 Fable 强**\n\n- 他说自己实测下来有这个感觉，完整评测第二天发。更值得记住的是另一条：模型是货架期最短的软件（除了 Opus 5.5 等少数特例），几周后所有人就换下一个了，所以没必要对某个模型动感情，重要的是让你的技能在任何新模型上都好用。\n\nhttps://x.com/petergyang/status/2122869524773179771\nhttps://x.com/petergyang/status/2122839368444661870\n\n---\n\n### 前 Cursor 设计负责人 Ryo Lu (ryolu_ on X)\n**疯狂的想法现在都能做了，但花的功夫一点没少**\n\n- 一句话的冷水，也是这一周所有「模型又强了」的帖子里最该记住的那句：能力上去了，care 和 effort 仍然是常数。\n\nhttps://x.com/ryolu_/status/2122929249967554583\n"</script>
